<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>일봉 백테스트 결과 · GON Stock</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2f4f1;
      color: #172f2b;
      font-family: "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
      line-height: 1.6;
      word-break: keep-all;
    }
    main { max-width: 57rem; margin: auto; padding: clamp(1.2rem, 5vw, 4rem); }
    header { border-top: .25rem solid #26594b; padding-top: .85rem; }
    .meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem; color: #475d54; font-size: .85rem; }
    h1 { margin: 1.65rem 0 .5rem; font-size: clamp(2rem, 5.5vw, 3.4rem); line-height: 1.25; letter-spacing: -.055em; }
    header p { margin: 0; color: #435950; }
    dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; margin: 2rem 0; border: 1px solid #cdd7ce; background: #cdd7ce; }
    dl > div { padding: clamp(1rem, 3vw, 1.6rem); background: #fff; }
    dt { color: #435950; font-weight: 600; }
    dd { margin: .4rem 0 0; }
    .metric { font-size: clamp(1.6rem, 4vw, 2.25rem); font-weight: 700; line-height: 1.3; }
    .definition, .reason { font-size: .9rem; color: #495c53; }
    figure { margin: 0; }
    figcaption { font-size: 1.25rem; font-weight: 700; margin-bottom: .75rem; }
    .plot { min-height: 12rem; display: grid; align-content: center; justify-items: center; gap: .3rem; padding: 1.5rem; text-align: center; background: #e8eee9; border: 1px solid #cdd7ce; }
    .plot strong { font-size: 1.4rem; }
    .reason { margin: 0; }
    footer { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #b7c5bb; color: #435950; font-size: .85rem; }
    footer p { margin: .2rem 0; }
    code { overflow-wrap: anywhere; }
    @media (max-width: 30rem) { main { padding: 1.1rem; } dl > div { padding: .85rem; } }
    @media print { body { background: white; } main { padding: 0; } dl, figure { break-inside: avoid; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="meta"><strong>GON Stock</strong><span>자료 확인일 <time datetime="2026-11-18">2026. 11. 18.</time></span></div>
      <h1>일봉 백테스트 결과</h1>
      <p>현재 작업 DB에 저장된 백테스트가 0건이어서 전략 성과를 계산할 수 없습니다.</p>
    </header>
    <dl aria-label="백테스트 성과 지표">
      <div>
        <dt>수익률</dt>
        <dd class="metric">미측정</dd>
        <dd class="definition">초기 자금 대비 최종 평가자산의 변화율</dd>
      </div>
      <div>
        <dt>최대 낙폭</dt>
        <dd class="metric">미측정</dd>
        <dd class="definition">이전 최고 평가자산에서 이후 저점까지의 가장 큰 하락률</dd>
      </div>
    </dl>
    <figure aria-labelledby="curve-title">
      <figcaption id="curve-title">누적 수익률 차트</figcaption>
      <div class="plot">
        <strong>미측정</strong>
        <p class="reason">차트를 그릴 날짜별 평가자산 기록이 없습니다.</p>
      </div>
    </figure>
    <footer aria-label="자료 출처">
      <p><strong>자료 출처</strong> · <code>.local/workspace.sqlite</code></p>
      <p>저장된 백테스트 실험 0건 · 백테스트용 일봉 0건</p>
    </footer>
  </main>
</body>
</html>
