<script>
const simple=document.getElementById('simple'),full=document.getElementById('full'),chart=document.getElementById('overview'),frame=document.getElementById('architecture'),message=document.getElementById('message');
let source;
function showDetail(detail){
  simple.setAttribute('aria-pressed',String(!detail));full.setAttribute('aria-pressed',String(detail));
  chart.hidden=detail;frame.hidden=!detail;message.hidden=true;
}
simple.onclick=()=>showDetail(false);
full.onclick=async()=>{
  showDetail(true);
  try{
    if(!source){
      const bytes=Uint8Array.from(atob(document.getElementById('packed').textContent.trim()),c=>c.charCodeAt(0));
      source=new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }
    if(!frame.hasAttribute('srcdoc')) frame.srcdoc=await source;
  }catch{
    frame.hidden=true;message.textContent='구조도를 열려면 최신 브라우저에서 이 파일을 다시 열어 주세요.';message.hidden=false;
  }
};
</script></html>
